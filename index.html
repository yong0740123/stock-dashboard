<script>
var EMBED = window.__PICKS__ || null;
var EMBED_HIST = window.__HISTORY__ || null;
var qCache = {};

function nextTradingDay(dstr, n) {
  var d = new Date(dstr + "T00:00:00");
  var c = 0;
  while (c < n) {
    d.setDate(d.getDate() + 1);
    if (d.getDay() !== 0 && d.getDay() !== 6) c++;
  }
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function jsonpQuote(code, cb) {
  var secid = (code.indexOf("60")===0 || code.indexOf("68")===0 ? "1." : "0.") + code;
  var name = "cb_" + code + "_" + Math.floor(Math.random()*1e6);
  var script = document.createElement("script");
  window[name] = function (obj) {
    try {
      var d = obj && obj.data;
      if (d && d.f43) cb({price:d.f43/100, open:d.f46/100, high:d.f44/100, low:d.f45/100,
                          prev:d.f60/100, pct:d.f170/100});
      else cb(null);
    } catch(e) { cb(null); }
    delete window[name];
    try { script.remove(); } catch(e) {}
  };
  script.src = "https://push2.eastmoney.com/api/qt/stock/get?secid=" + secid + "&fields=f43,f44,f45,f46,f60,f170&cb=" + name;
  script.onerror = function(){ cb(null); try{script.remove();}catch(e){} };
  document.body.appendChild(script);
}

function fmt(x){ return (x||x===0) ? Number(x).toFixed(2) : "—"; }

function statusOf(p, q) {
  if (!q || !q.open) return ["待行情", "gray"];
  var lim = (p.code.indexOf("300")===0 || p.code.indexOf("301")===0) ? 0.195 : 0.098;
  var gap = q.prev ? q.open/q.prev - 1 : 0;
  if (gap >= lim - 0.005) return ["开盘涨停·放弃", "red"];
  if (gap > 0.05) return ["高开>5%·放弃", "orange"];
  var entry = q.open;
  if (q.price <= entry*0.98) return ["已触止损", "red"];
  if (q.price >= entry*1.04) return ["已触止盈", "green"];
  return ["可买/持有", "blue"];
}

function render(data) {
  var picks = data.picks || [], watch = data.watch || [], mkt = data.market || {};
  var sd = data.date || "";
  var buyDate = sd ? nextTradingDay(sd, 1) : "—";
  var exitDate = sd ? nextTradingDay(sd, 2) : "—";
  document.getElementById("sub").textContent =
    "信号日期 " + sd + "｜开仓 " + buyDate + " 9:30｜了结 " + exitDate + "｜更新 " + new Date().toLocaleString("zh-CN");
  var st = mkt.state || "—";
  document.getElementById("top").innerHTML =
    '<div class="pill">市场 <b class="' + (st==="强势"?"ok":"weak") + '">' + st + '</b>（宽度 ' + ((mkt.breadth||0)*100).toFixed(0) + '%）</div>' +
    '<div class="pill">今日推荐 <b>' + picks.length + '</b> 只</div>';
  document.getElementById("plan").style.display = "block";
  document.getElementById("plan").innerHTML =
    "开仓计划：<b>" + buyDate + "（下一交易日）9:30 集合竞价/开盘买入</b>；" +
    "放弃条件：开盘涨停或高开>5%；止损 -2%，止盈 +4%；" +
    "<b>" + exitDate + " T+2 了结</b>；单票 15%-20%。";

  var cards = "";
  for (var i=0;i<picks.length;i++){
    var p = picks[i], q = qCache[p.code] || null;
    var s = statusOf(p,q);
    var entry = (q && q.open) ? q.open : p.close;
    var stop = entry*0.98, target = entry*1.04;
    var cur = q ? q.price : p.close;
    var pct = q ? q.pct : (p.ret||0)*100;
    var retTxt = q ? ("本次收益 " + ((cur/entry-1)>=0?"+":"") + ((cur/entry-1)*100).toFixed(2) + "%") : "待开盘";
    var line = q ? ("开盘 " + fmt(q.open) + "｜现价 " + fmt(cur) + "（" + (pct>=0?"+":"") + pct.toFixed(1) + "%）")
                 : ("昨收 " + fmt(p.close) + "（" + ((p.ret||0)*100>=0?"+":"") + ((p.ret||0)*100).toFixed(1) + "%）｜实时行情加载中");
    cards += '<div class="card"><div class="rank">' + (i+1) + '</div>' +
      '<div class="head"><span class="name">' + p.name + '</span><span class="code">' + p.code + '</span>' +
      '<span class="tag">' + (p.industry||"") + '</span><span class="status ' + s[1] + '">' + s[0] + '</span></div>' +
      '<div class="line">' + line + '</div>' +
      '<div class="levels"><span>买入参考 <b>' + fmt(entry) + '</b></span>' +
      '<span class="stop">止损 <b>' + fmt(stop) + '</b>（-2%）</span>' +
      '<span class="target">止盈 <b>' + fmt(target) + '</b>（+4%）</span></div>' +
      '<div class="ret" style="color:' + (q && cur>=entry ? "#b91c1c" : "#15803d") + '">' + retTxt + '</div>' +
      '<div class="meta">5日 ' + ((p.ret5||0)*100).toFixed(1) + '%｜250分位 ' + ((p.pos250||0)*100).toFixed(0) +
      '%｜行业位置 ' + ((p.ind_pos||0)*100).toFixed(0) + '%｜RSI6 ' + (p.rsi6||0).toFixed(0) +
      '｜评分 ' + (p.score||0).toFixed(0) + '｜成交额 ' + ((p.amount||0)/1e8).toFixed(1) + '亿</div></div>';
  }
  document.getElementById("cards").innerHTML = cards || '<div class="card">今日无符合条件标的，空仓。</div>';

  var rows = "<tr><th>名称</th><th>代码</th><th>行业</th><th>评分</th><th>昨收</th><th>今日</th></tr>";
  for (var j=0;j<Math.min(watch.length,10);j++){
    var w = watch[j], wq = qCache[w.code];
    rows += "<tr><td>" + (w.name||"") + "</td><td>" + (w.code||"") + "</td><td>" + (w.industry||"") + "</td><td>" +
      (w.score||0).toFixed(0) + "</td><td>" + fmt(w.close) + "</td><td>" +
      (wq ? ((wq.pct>=0?"+":"") + wq.pct.toFixed(1) + "%") : "—") + "</td></tr>";
  }
  document.getElementById("watch").innerHTML = rows;
}

function loadHistory(h) {
  var st = (h && h.month) || {};

  document.getElementById("hstats").innerHTML =

    '<div class="pill">批次 <b>' + st.n + '</b></div>' +
    '<div class="pill">胜率 <b>' + (st.win*100).toFixed(0) + '%</b></div>' +
    '<div class="pill">单批均 <b>' + (st.avg>=0?"+":"") + (st.avg*100).toFixed(2) + '%</b></div>' +
    '<div class="pill">回撤 <b>' + (st.dd*100).toFixed(1) + '%</b></div>';
}

function loadPaper(p) {
  if (!p || !p.capital) {
    document.getElementById("pstats").innerHTML = '<div class="pill">模拟盘等待 2026-10-19 开盘</div>';
    return;
  }
  var ret = p.equity / p.capital - 1;
  document.getElementById("pstats").innerHTML =
    '<div class="pill">起始 <b>2026-10-19</b></div>' +
    '<div class="pill">本金 <b>100 万</b></div>' +
    '<div class="pill">净值 <b>' + (p.equity/1e4).toFixed(2) + ' 万（' + (ret>=0?"+":"") + (ret*100).toFixed(2) + '%）</b></div>' +
    '<div class="pill">持仓 <b>' + ((p.positions||[]).length) + '</b> 只</div>' +
    '<div class="pill">状态 <b>' + (p.status||"") + '</b></div>';
  var rows = "<tr><th>股票</th><th>买入日</th><th>成本</th><th>现价</th><th>数量</th><th>收益</th></tr>";
  (p.positions||[]).forEach(function(x){
    var pnl = (x.close/x.entry-1)*100;
    rows += "<tr><td>" + (x.name||"") + "</td><td>" + (x.date||"") + "</td><td>" + x.entry.toFixed(2) + "</td><td>" + x.close.toFixed(2) + "</td><td>" + x.qty + "</td><td style='color:" + (pnl>=0?"#b91c1c":"#15803d") + "'>" + pnl.toFixed(2) + "%</td></tr>";
  });
  document.getElementById("ptrades").innerHTML = rows;
}

function loadQuotes(data) {
  var list = (data.picks||[]).concat((data.watch||[]).slice(0,10));
  list.forEach(function(o){
    if (!o || !o.code) return;
    jsonpQuote(o.code, function(q){ qCache[o.code]=q; });
  });
}

async function boot(){
  var data = EMBED, hist = EMBED_HIST;
  if (!data) {
    try {
      var r = await fetch("./data/latest.json?t=" + Date.now(), {cache:"no-store"});
      if (!r.ok) throw new Error("HTTP " + r.status);
      data = await r.json();
    } catch(e) {
      document.getElementById("sub").textContent = "数据加载失败：" + (e && e.message ? e.message : "请刷新重试");
      return;
    }
  }
  render(data);
  loadQuotes(data);
  setTimeout(function(){ render(data); }, 2500);
  setTimeout(function(){ render(data); }, 6000);
  if (!hist) {
    try {
      var rh = await fetch("./data/history.json?t=" + Date.now(), {cache:"no-store"});
      if (rh.ok) hist = await rh.json();
    } catch(e) {}
  }
  loadHistory(hist);
  try { loadPaper(window.__PAPER__); } catch(e) {}
  setTimeout(boot, 60000);
}
boot();
</script>
</body>
</html>
